<!DOCTYPE html>
<html>
<head>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 400px;
            margin: 0 auto;
        }
        input {
            padding: 8px;
            margin: 5px 0;
            width: 100%;
        }
        button {
            padding: 10px;
            margin: 10px 0;
            width: 100%;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            background-color: #f0f0f0;
            border-left: 4px solid #4CAF50;
        }
    </style>
</head>
<body>

<h2>Add Two Numbers</h2>

<input type="text" id="input1" placeholder="Enter first number">
<input type="text" id="input2" placeholder="Enter second number">

<button id="addBtn">Add Numbers</button>

<div id="resultOnDoc" class="result">
    Result will appear here
</div>

<input type="text" id="resultInInput" placeholder="Result will appear here" readonly style="background-color: #e9e9e9;">

<script>
    $('addBtn').click(
        function () {
        let number1 = parseInt($('#input1').val());
        let number2 = parseInt($('#input2').val());

        let result = number1 + number2;
        $('#resultOnDoc').text(`Result: ${result}`);
        $('#resultInInput').val(result);
    }
    );
</script>



</body>
</html>
