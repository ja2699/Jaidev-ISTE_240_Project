<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Temperature Checker</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
            background: #f0f0f0;
        }
        .container {
            background: white;
            max-width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input, button {
            padding: 10px;
            margin: 10px;
            font-size: 16px;
        }
        .weather {
            margin-top: 20px;
            padding: 20px;
            background: #e0f2fe;
            border-radius: 10px;
        }
        .temp {
            font-size: 48px;
            font-weight: bold;
            color: #0284c7;
        }
        .error {
            color: red;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>🌍 Temperature Checker</h2>
    <input type="text" id="city" placeholder="Enter city name" value="Paris">
    <br>
    <button id="getTemp">Get Temperature</button>
    <div id="result"></div>
</div>
<script>
    // https://goweather.herokuapp.com/weather/' + city
    $("#getTemp").click(function(){
        let city_name = $("#city").val();
        let apiURL = "https://goweather.herokuapp.com/weather/" + city_name;

        $.get(apiURL, function(data){
            let result = `Temparature in your city is: ${data.temperature}`;
            $("#result").html(result);
        });
    });
</script>
</body>
</html>
